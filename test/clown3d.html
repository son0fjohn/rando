<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>clown3d</title>
<script type="importmap">
{ "imports": {
  "https://esm.sh/three@0.160.0": "/node_modules/three/build/three.module.js",
  "https://esm.sh/three@0.160.0/": "/node_modules/three/",
  "three": "/node_modules/three/build/three.module.js"
} }
</script>
<link rel="stylesheet" href="/web/theme.css">
<style>body { margin: 0; background: #1a0d14; display: grid; gap: 8px; padding: 8px; grid-template-columns: repeat(auto-fill, 300px); } .cell { color: #fff; font: 12px system-ui; } .hr-show { margin: 0; }</style>
</head><body>
<!-- Humiliation Ritual's 3D clown on its own: test/clown3d_shots.mjs moves the
     canvas between beats and freezes the clock to shoot each moment. -->
<div class="cell"><div class="hr-show" id="w"></div><span id="lbl"></span></div>
<script type="module">
  import { clownKit } from "/web/clown3d.js";
  import { spriteFor, silhouetteFor, SPRITE } from "/web/charsprite.js";
  const k = await clownKit();
  window.__kit = k;
  const LOOKS = [
    { skin: "2", hair: "m1", hairColor: "black", top: "tee-baggy-black", bottom: "cargo-black", shoes: "sneaker-white-stripe" },
    { skin: "4", hair: "f2", hairColor: "yellow", top: "hoodie-maroon", bottom: "jeans-baggy-blue", shoes: "sneaker-hitop-black" },
    { skin: "1", hair: "f1", hairColor: "pink", top: "tee-baggy-black", bottom: "cargo-black", shoes: "sneaker-white-stripe" },
    { skin: "3", hair: "m3", hairColor: "brown", top: "hoodie-maroon", bottom: "cargo-black", shoes: "sneaker-white-stripe" },
    { skin: "5", hair: "m2", hairColor: "black", top: "tee-baggy-black", bottom: "jeans-baggy-blue", shoes: "sneaker-hitop-black" },
  ];
  const NAMES = ["tony", "bella", "cy", "dee", "eve", "fay"];
  const people = NAMES.map((n, i) => ({ id: `p${i}`, handle: n, face: silhouetteFor(LOOKS[i % LOOKS.length]).url, cols: SPRITE.COLS, rows: SPRITE.FACINGS.length }));
  await Promise.all(NAMES.map(async (n, i) => { try { people[i].face = (await spriteFor(LOOKS[i % LOOKS.length])).url; } catch {} }));
  k?.setCast(people);
  // freeze: draw beat `name` at beat time t (s), wall time T (s)
  window.__frame = (name, t, T = 1.0, chosen = "p1") => {
    const w = document.getElementById("w");
    k.attach(w); cancelAnimationFrame(k.raf); k.raf = 0;
    k.beat(name, t * 1000, { chosen });
    k.pose(T, t);
    k.renderer.render(k.scene, k.camera);
    document.getElementById("lbl").textContent = `${name} @ ${t.toFixed(2)}s`;
  };
  window.__ready = !!k;
  window.__failed = !k;
</script>
</body></html>

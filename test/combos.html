<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>outfit combinations — check</title>
<!-- Dev page: every top × bottom on the animated character, in the idle and
     at a walk stride (front 3/4 + back), and every hairstyle with every
     top, to catch clipping. node test/combos_shots.mjs <dir> screenshots it. -->
<base href="/web/">
<script type="importmap">
{ "imports": { "https://esm.sh/three@0.160.0": "/node_modules/three/build/three.module.js", "https://esm.sh/three@0.160.0/": "/node_modules/three/", "three": "/node_modules/three/build/three.module.js" } }
</script>
<style>
  body { margin: 0; padding: 10px; background: #1b1f3d; color: #e8ebff; font: 11px/1.3 system-ui, sans-serif; }
  h3 { margin: 12px 0 4px; font-size: 13px; }
  .row { display: flex; flex-wrap: wrap; gap: 3px; }
  .cell { position: relative; } .cell small { position: absolute; left: 3px; top: 2px; color: #9aa3d9; max-width: 150px; }
  canvas { display: block; }
</style>
</head>
<body>
<div id="g"></div>
<script type="module">
import * as THREE from "https://esm.sh/three@0.160.0";
import * as A from "/web/avatar3.js";
const P = A.PART_OPTIONS3;
const W = 110, H = 150;
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
r.setPixelRatio(1.5); r.setSize(W, H); r.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x2a3160);
scene.add(new THREE.HemisphereLight(0xdce8ff, 0x2a3570, 1.7));
const key = new THREE.DirectionalLight(0xfff3dc, 1.7); key.position.set(5, 16, 14); scene.add(key);
const cam = new THREE.PerspectiveCamera(30, W / H, 0.5, 300);
cam.position.set(0, 9, 34); cam.lookAt(0, 7.2, 0);
const ch = await A.makeAnimatedCharacter({ skin: "2", hair: "m1", hairColor: "black", face: "f1", iris: "brown", top: "none", bottom: "none", shoes: "sneaker-white-stripe" });
scene.add(ch.group);
const g = document.getElementById("g");
async function grid(title, combos) {
  const h = document.createElement("h3"); h.textContent = title; g.append(h);
  const row = document.createElement("div"); row.className = "row"; g.append(row);
  for (const [label, cfg, pose, yaw] of combos) {
    ch.setConfig(cfg); await ch.ready;
    ch.pose(pose, pose === "walk" ? ch.clipLength("walk") * 0.25 : 0.4);
    ch.group.rotation.y = yaw;
    r.render(scene, cam);
    const c = document.createElement("canvas"); c.width = W * 1.5; c.height = H * 1.5; c.style.width = W + "px"; c.style.height = H + "px";
    c.getContext("2d").drawImage(r.domElement, 0, 0);
    const cell = document.createElement("div"); cell.className = "cell"; cell.append(c);
    const s = document.createElement("small"); s.textContent = label; cell.append(s); row.append(cell);
  }
}
const tops = P.top, bottoms = P.bottom;
for (const top of tops) {
  const combos = [];
  for (const bottom of bottoms) for (const [pose, yaw] of [["idle", 0.5], ["walk", 0.5], ["walk", 3.4]])
    combos.push([`${bottom} · ${pose}${yaw > 3 ? " back" : ""}`, { top, bottom }, pose, yaw]);
  await grid(`top: ${top}`, combos);
}
const hc = [];
for (const hair of P.hair) for (const top of tops) hc.push([`${hair} + ${top}`, { hair, top, bottom: "cargo-black" }, "walk", 0.9]);
await grid("hair × top (walk, 3/4)", hc);
window.__done = true;
</script>
</body>
</html>

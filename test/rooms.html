<!-- One of the game scenes' rooms (web/retrorooms.js) on its own:
     ?room=study|lounge. test/rooms_shots.mjs shoots each. -->
<div id="w"></div>
<script type="module">
  import { retroRoom } from "/web/retrorooms.js";
  const kind = new URLSearchParams(location.search).get("room") || "study";
  try { window.__room = await retroRoom(kind, document.getElementById("w")); window.__ready = true; }
  catch (e) { console.error(e); window.__failed = String(e?.message ?? e); }
</script>

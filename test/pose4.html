<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>character stances — check</title>
<!-- Dev page: the player character (web/avatar4.js) in each stance the game
     hosts' rooms use (sitting cross-legged on a floor cushion, standing), seen
     from the front, the 3/4 and the side, for a few outfits; the floor and
     the cushion top are drawn so a float or a sink shows. Outfits go in the
     hash as JSON: pose4.html#{"puffer":{"top":"puffer-black"}} -->
<base href="/web/">
<script type="importmap">
{ "imports": {
  "https://esm.sh/three@0.160.0": "/node_modules/three/build/three.module.js",
  "https://esm.sh/three@0.160.0/": "/node_modules/three/",
  "three": "/node_modules/three/build/three.module.js"
} }
</script>
<style>
  body { margin: 0; padding: 8px; background: #1b1f3d; color: #e8ebff; font: 12px/1.3 system-ui, sans-serif; }
  .row { display: flex; gap: 4px; margin-bottom: 4px; }
  .cell { position: relative; } .cell small { position: absolute; left: 4px; top: 2px; color: #dfe4ff; }
  canvas { display: block; background: #4a5a7a; }
</style>
</head>
<body>
<div id="grid"></div>
<script type="module">
import * as THREE from "https://esm.sh/three@0.160.0";
import * as A from "/web/avatar4.js";
const looks = JSON.parse(decodeURIComponent(location.hash.slice(1) || "") || "null") ?? { plain: {} };
const W = 220, H = 260, SEAT = 0.1;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xffffff, 0x666677, 2.2));
const sun = new THREE.DirectionalLight(0xffffff, 1.4); sun.position.set(1, 2, 2); scene.add(sun);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(4, 4), new THREE.MeshLambertMaterial({ color: 0x8a8070 })); floor.rotation.x = -Math.PI / 2; scene.add(floor);
const cushion = new THREE.Mesh(new THREE.CylinderGeometry(0.26, 0.28, SEAT, 24), new THREE.MeshLambertMaterial({ color: 0xa04060 })); cushion.position.y = SEAT / 2; scene.add(cushion);
const cam = new THREE.PerspectiveCamera(30, W / H, 0.05, 20);
const grid = document.getElementById("grid");
const views = [["front", 0], ["3/4", -0.8], ["side", -Math.PI / 2], ["back 3/4", -2.4]];
for (const [name, look] of Object.entries(looks)) {
  for (const stance of ["sit", "stand"]) {
    const c = await A.makeCharacter4(look); await c.ready;
    c.group.scale.setScalar(1.25 / 15); c.unit = 1.25 / 15; scene.add(c.group);
    c.stance = stance; cushion.visible = stance === "sit";
    const holder = new THREE.Group(); scene.add(holder); holder.add(c.group);
    holder.position.y = stance === "sit" ? SEAT : 0;
    c.tick(0); c.tick(0.5);
    const row = document.createElement("div"); row.className = "row"; grid.appendChild(row);
    for (const [vn, a] of views) {
      const r = stance === "sit" ? 1.9 : 2.6, ty = stance === "sit" ? 0.38 : 0.62;
      cam.position.set(Math.sin(a) * r, ty + 0.25, Math.cos(a) * r); cam.lookAt(0, ty, 0);
      renderer.render(scene, cam);
      const k = document.createElement("canvas"); k.width = W; k.height = H; k.getContext("2d").drawImage(renderer.domElement, 0, 0);
      const cell = document.createElement("div"); cell.className = "cell"; cell.append(k); const l = document.createElement("small"); l.textContent = `${name} · ${stance} · ${vn}`; cell.append(l); row.append(cell);
    }
    scene.remove(holder); c.dispose();
  }
}
window.__done = true;
</script>
</body>
</html>

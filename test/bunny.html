<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>bunny</title>
<script type="importmap">
{ "imports": {
  "https://esm.sh/three@0.160.0": "/node_modules/three/build/three.module.js",
  "https://esm.sh/three@0.160.0/": "/node_modules/three/",
  "three": "/node_modules/three/build/three.module.js"
} }
</script>
<!--INDEX_CSS-->
<link rel="stylesheet" href="/web/theme.css">
<style>html,body{margin:0;background:#000;height:100%} #w{position:relative;width:100vw;height:100vh;overflow:hidden} #d{position:absolute;left:9px;right:9px;bottom:30px}</style>
</head><body>
<!-- The Art Gallery's host on her own: test/bunny_shots.mjs drives her
     (poses, the drape, the photo, the 3D title plaques on the wall, the
     dialog box) and shoots each moment. -->
<div id="w"></div>
<div id="d"></div>
<script type="module">
  import { bunnyScene } from "/web/bunny.js";
  import { dialogBox } from "/web/dialog.js";
  window.__dlg = dialogBox(document.getElementById("d"), { name: "Bunny" });
  // __plaques(["museum of regret", "do not perceive me"], "read" | "vote" | "result", { picked, top, by, votes }) / __plaques(null): under velvet
  window.__plaques = (titles, mode = "read", o = {}) => {
    if (!titles) { __p.room.plaqueState({ covered: true, picked: null, top: null }); return; }
    titles.forEach((t, i) => __p.room.plaque(i, { label: `TITLE ${["I", "II"][i]}`, title: t, ...(mode === "result" ? { by: `— ${o.by?.[i] ?? "someone"}`, votes: o.votes?.[i] ?? "" } : {}) }));
    __p.room.plaqueState({ covered: false, picked: o.picked ?? null, top: mode === "result" ? (o.top ?? null) : null, instant: !!o.instant });
  };
  try {
    window.__p = await bunnyScene(document.getElementById("w"));
    window.__ready = true;
  } catch (e) { console.error(e); window.__failed = String(e?.message ?? e); }
</script>
</body></html>

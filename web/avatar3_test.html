<!doctype html>
<!-- dev harness: renders a grid of avatar3 configs for visual QC.
     Not linked from the app. Open /avatar3_test.html on the dev server. -->
<html>
<head><meta charset="utf-8"><title>avatar3 test — loading</title>
<style>body{margin:0;background:#9aa0a8}canvas{display:block}</style></head>
<body>
<script>
window.__errs = [];
window.addEventListener("error", e => {
  window.__errs.push(String(e.error?.stack || e.message));
  document.title = "ERR: " + (e.message || "?");
});
window.addEventListener("unhandledrejection", e => {
  window.__errs.push(String(e.reason?.stack || e.reason));
  document.title = "REJ: " + String(e.reason).slice(0, 120);
});
</script>
<script type="module">
import * as THREE from "https://esm.sh/three@0.160.0";
import { makeHumanCharacter, avatarThumb3 } from "./avatar3.js";

const CFGS = [
  { skin: "1", hair: "f1", hairColor: "black", face: "f1", iris: "current" },
  { skin: "2", hair: "f2", hairColor: "yellow", face: "f5", iris: "blue",
    top: "tee-baggy-black", bottom: "jeans-baggy-blue", shoes: "sneaker-white-lowtop" },
  { skin: "3", hair: "m1", hairColor: "red", face: "f2", iris: "green",
    bottom: "camo", shoes: "boot-work-tan" },
  { skin: "4", hair: "f4", hairColor: "white", face: "f3", iris: "navy",
    bottom: "skirt-pleated-black", shoes: "clog-pink" },
  { skin: "5", hair: "m5", hairColor: "brown", face: "f6", iris: "brown",
    top: "tee-baggy-black", bottom: "shorts-green", shoes: "sneaker-hitop-black" },
  { skin: "1", hair: "none", hairColor: "black", face: "f4", iris: "black",
    bottom: "track-navy", shoes: "loafer-black" },
];
const CELL = 300, ANGLES = [0, 0.8, Math.PI];
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
r.setSize(CELL, CELL);
const out = document.createElement("canvas");
out.width = CELL * ANGLES.length;
out.height = CELL * CFGS.length;
document.body.appendChild(out);
const g2 = out.getContext("2d");
g2.fillStyle = "#9aa0a8";
g2.fillRect(0, 0, out.width, out.height);

const chars = await Promise.all(CFGS.map(c => makeHumanCharacter(c)));
await new Promise(res => setTimeout(res, 6000)); // let attachments land

chars.forEach((ch, row) => {
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x9aa0a8);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8f96, 1.1));
  const sun = new THREE.DirectionalLight(0xffffff, 1.0);
  sun.position.set(40, 60, 50);
  scene.add(sun);
  scene.add(ch.group);
  ANGLES.forEach((a, col) => {
    ch.group.rotation.y = a;
    const cam = new THREE.PerspectiveCamera(30, 1, 1, 300);
    cam.position.set(0, 9, 36);
    cam.lookAt(0, 7.4, 0);
    r.render(scene, cam);
    g2.drawImage(r.domElement, col * CELL, row * CELL, CELL, CELL);
  });
  // thumb strip in the corner of the first cell
  const th = new Image();
  th.src = avatarThumb3(ch.config, 96);
  th.onload = () => g2.drawImage(th, row * 0, 4, 0, 0); // no-op place
});
document.title = "avatar3 test — READY";
</script>
</body>
</html>
